name: Ejecutar EA2 modelos

# Se ejecuta solo cada vez que se hace push a main.
# workflow_dispatch agrega además un botón opcional para correrlo a mano.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-ea2-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      - name: Limpiar datos y resultados anteriores
        run: |
          mkdir -p src/actividades/datos src/actividades/entrenamiento src/actividades/reportes src/actividades/figuras
          find src/actividades/datos src/actividades/entrenamiento src/actividades/reportes src/actividades/figuras -mindepth 1 -delete

      # Descarga el dataset, preprocesa, entrena y evalúa los dos modelos y genera el .txt
      - name: Ejecutar EA2_Modelos.ipynb
        working-directory: src/actividades
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            EA2_Modelos.ipynb

      - name: Mostrar el resumen en el registro
        run: cat src/actividades/reportes/EA2_resumen_modelos.txt

      - name: Publicar resultados como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: resumen-ea2
          path: |
            src/actividades/reportes/
            src/actividades/figuras/
            src/actividades/entrenamiento/
            src/actividades/EA2_Modelos.ipynb
          if-no-files-found: error

      # Guarda en el repositorio el notebook con resultados, el .txt y las figuras.
      # [skip ci] evita que este commit vuelva a lanzar el workflow.
      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/actividades/reportes src/actividades/figuras src/actividades/EA2_Modelos.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de EA2 [skip ci]"
          git push origin HEAD:main
